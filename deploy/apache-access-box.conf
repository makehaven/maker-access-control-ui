# Staff front door to the local access authority (app on :8080).
# Badge lookups from cardsystem and the health probe stay open on the LAN;
# everything else (admin UI, import, simulator) needs the staff password.
<VirtualHost *:80>
    ServerName access-box
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    <Location />
        AuthType Basic
        AuthName "MakeHaven access box (staff)"
        AuthUserFile /etc/apache2/access-box.htpasswd
        Require valid-user
    </Location>
    <LocationMatch ^/(api/v0/|user/login|health)>
        Require all granted
    </LocationMatch>
</VirtualHost>
